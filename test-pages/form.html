<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Playwright 自动化测试页</title>
  <style>
    body { font-family: 'Microsoft YaHei', sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    h1 { color: #1a73e8; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    button { background: #1a73e8; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1557b0; }
    #result { margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 4px; display: none; }
    .error { background: #ffebee !important; }
  </style>
</head>
<body>
  <h1>📋 用户注册表单</h1>
  <form id="registerForm">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名" required>
    </div>
    <div class="form-group">
      <label for="email">邮箱</label>
      <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
    </div>
    <div class="form-group">
      <label for="role">角色</label>
      <select id="role" name="role">
        <option value="">请选择</option>
        <option value="dev">开发者</option>
        <option value="qa">测试工程师</option>
        <option value="pm">产品经理</option>
      </select>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="agree" name="agree"> 同意服务条款
      </label>
    </div>
    <button type="submit">提交注册</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());
      const result = document.getElementById('result');
      result.style.display = 'block';

      if (!data.agree) {
        result.className = 'error';
        result.innerHTML = '❌ <b>错误：</b>请先同意服务条款！';
      } else {
        result.className = '';
        result.innerHTML = `✅ <b>注册成功！</b><br>
          用户名：${data.username}<br>
          邮箱：${data.email}<br>
          角色：${data.role}<br>
          提交时间：${new Date().toLocaleString()}`;
      }
    });
  </script>
</body>
</html>
